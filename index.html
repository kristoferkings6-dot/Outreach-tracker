<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Outreach Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181A;
    --surface: #1F2123;
    --surface-2: #292B2E;
    --text: #ECE9E2;
    --text-muted: #93908A;
    --border: #34363A;
    --ig: #C9508A;
    --ig-dim: #4A2A38;
    --email: #4E7FDB;
    --email-dim: #263652;
    --whatsapp: #3FA772;
    --whatsapp-dim: #1F4636;
    --gold: #D4A64A;
    --danger: #C9573F;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); color: var(--text); }
  body{
    font-family: 'Inter', system-ui, sans-serif;
    padding: 28px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 980px; margin: 0 auto; }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .display{ font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }

  /* header */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom: 2px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1{
    font-size: 30px; font-weight:700; margin:0; letter-spacing:0.05em;
  }
  header .sub{ color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .streak{
    display:flex; align-items:center; gap:10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px;
  }
  .streak .num{ font-size: 22px; font-weight:600; color: var(--gold); }
  .streak .lbl{ font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .date-picker{
    background: var(--surface); border:1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  }
  .top-stat{
    display:flex; align-items:center; gap:10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px;
  }
  .top-stat .dot{ width:10px; height:10px; border-radius:50%; }
  .top-stat .lbl{ font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .top-stat .name{ font-size: 16px; font-weight:600; }

  /* monthly overview */
  .monthly-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .monthly-head h2{ font-size: 16px; margin:0; font-weight: 700; letter-spacing: 0.03em; }
  .monthly-block{ background: var(--surface); border:1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 26px; }
  .monthly-total{ font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
  .monthly-total .n{ color: var(--text); font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .monthly-row{ display:flex; align-items:center; gap:14px; margin-bottom: 10px; }
  .monthly-row:last-child{ margin-bottom:0; }
  .monthly-label{ width: 90px; font-size: 13px; color: var(--text-muted); flex-shrink:0; display:flex; align-items:center; gap:6px; }
  .monthly-bar-wrap{ flex:1; height: 22px; background: var(--surface-2); border-radius: 4px; overflow:hidden; }
  .monthly-bar{ height:100%; border-radius: 4px; transition: width .4s ease; }
  .monthly-count{ width: 50px; text-align:right; font-family:'IBM Plex Mono', monospace; font-size: 13px; flex-shrink:0; }

  /* channel cards */
  .channels{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
  @media (max-width: 760px){ .channels{ grid-template-columns: 1fr; } }
  .card{
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; position: relative; overflow: hidden;
  }
  .card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .card.ig::before{ background: var(--ig); }
  .card.email::before{ background: var(--email); }
  .card.whatsapp::before{ background: var(--whatsapp); }
  .card h3{ margin:0 0 12px 0; font-size: 18px; font-weight:700; padding-left: 6px; }
  .stage-row{ display:flex; align-items:center; justify-content:space-between; padding: 6px 0 6px 6px; }
  .stage-row + .stage-row{ border-top: 1px solid var(--surface-2); }
  .stage-lbl{ font-size: 13px; color: var(--text-muted); }
  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{
    width: 24px; height:24px; border-radius:6px; border:1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor:pointer; font-size: 14px; line-height:1;
  }
  .stepper button:hover{ background: var(--border); }
  .stepper .val{ min-width: 24px; text-align:center; font-size: 15px; font-weight:600; }

  /* funnel */
  .funnel-title{ font-size: 14px; color: var(--text-muted); margin: 26px 0 10px; padding-left:2px; }
  .funnel-block{ background: var(--surface); border:1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 26px; }
  .funnel-stage{ display:flex; align-items:center; gap:14px; margin-bottom: 10px; }
  .funnel-stage:last-child{ margin-bottom: 0; }
  .funnel-bar-wrap{ flex:1; height: 26px; background: var(--surface-2); border-radius: 4px; overflow:hidden; }
  .funnel-bar{ height:100%; border-radius: 4px; transition: width .4s ease; }
  .funnel-label{ width: 90px; font-size: 13px; color: var(--text-muted); flex-shrink:0; }
  .funnel-count{ width: 130px; font-size: 13px; text-align:right; flex-shrink:0; }
  .funnel-count .n{ font-weight:600; }
  .funnel-count .pct{ color: var(--text-muted); margin-left: 6px; }

  /* ledger table */
  .ledger-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .ledger-head h2{ font-size: 16px; margin:0; font-weight: 700; letter-spacing: 0.03em; }
  .copy-btn{
    background: var(--surface-2); border:1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 7px; font-size: 12px; cursor:pointer;
  }
  .copy-btn:hover{ background: var(--border); }
  .copy-btn.copied{ color: var(--whatsapp); border-color: var(--whatsapp); }
  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  thead th{
    text-align:left; color: var(--text-muted); font-weight:500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  tbody td{ padding: 7px 8px; border-bottom: 1px solid var(--surface-2); font-family:'IBM Plex Mono', monospace; }
  tbody tr:hover{ background: var(--surface-2); }
  .ch-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .empty-row td{ color: var(--text-muted); font-family: 'Inter', sans-serif; padding: 16px 8px; text-align:center; }
  .table-scroll{ max-height: 260px; overflow-y:auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .table-scroll table{ padding: 4px 6px; }

  footer{ margin-top: 20px; font-size: 11px; color: var(--text-muted); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="display">Outreach Ledger</h1>
      <div class="sub" id="todayLabel"></div>
    </div>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <input type="date" class="date-picker" id="datePicker">
      <div class="streak">
        <div class="num mono" id="streakNum">0</div>
        <div class="lbl">day streak</div>
      </div>
      <div class="top-stat">
        <span class="dot" id="mostUsedDot"></span>
        <div>
          <div class="lbl">Most used medium</div>
          <div class="name" id="mostUsedName">–</div>
        </div>
      </div>
    </div>
  </header>

  <div class="channels" id="channelCards"></div>

  <div class="monthly-head">
    <h2 class="display">Monthly reach</h2>
    <input type="month" class="date-picker" id="monthPicker">
  </div>
  <div class="monthly-block" id="monthlyBlock"></div>

  <div class="funnel-title display" id="funnelTitle">All-time funnel · combined</div>
  <div class="funnel-block" id="funnelBlock"></div>

  <div class="ledger-head">
    <h2 class="display">Ledger</h2>
    <button class="copy-btn" id="copyBtn">Copy for Sheets</button>
  </div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr><th>Date</th><th>Channel</th><th>Sent</th><th>Replied</th><th>Booked</th><th>Closed</th></tr>
      </thead>
      <tbody id="ledgerBody"></tbody>
    </table>
  </div>

  <footer>Data is stored locally to this dashboard. Use "Copy for Sheets" to paste a tab-separated snapshot straight into Google Sheets.</footer>
</div>

<script>
const CHANNELS = [
  { key: 'ig', label: 'Instagram', color: 'var(--ig)' },
  { key: 'email', label: 'Email', color: 'var(--email)' },
  { key: 'whatsapp', label: 'WhatsApp', color: 'var(--whatsapp)' },
];
const STAGES = ['sent','replied','booked','closed'];
const STAGE_LABELS = { sent:'Sent', replied:'Replied', booked:'Booked', closed:'Closed' };

let data = { entries: {} }; // entries[date][channel] = {sent,replied,booked,closed}
let currentDate = new Date().toISOString().slice(0,10);
let currentMonth = new Date().toISOString().slice(0,7); // YYYY-MM

function emptyStage(){ return { sent:0, replied:0, booked:0, closed:0 }; }

function ensureEntry(date, ch){
  if(!data.entries[date]) data.entries[date] = {};
  if(!data.entries[date][ch]) data.entries[date][ch] = emptyStage();
  return data.entries[date][ch];
}

async function loadData(){
  try{
    const res = await window.storage.get('outreach-data', false);
    if(res && res.value){
      data = JSON.parse(res.value);
      if(!data.entries) data.entries = {};
    }
  }catch(e){
    data = { entries: {} };
  }
}

async function saveData(){
  try{
    await window.storage.set('outreach-data', JSON.stringify(data), false);
  }catch(e){
    console.error('Save failed', e);
  }
}

function fmtDateLabel(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function computeStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = d.toISOString().slice(0,10);
    const dayEntries = data.entries[key];
    const hasActivity = dayEntries && CHANNELS.some(c => dayEntries[c.key] && dayEntries[c.key].sent > 0);
    if(hasActivity){
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function renderChannelCards(){
  const container = document.getElementById('channelCards');
  container.innerHTML = '';
  CHANNELS.forEach(ch => {
    const entry = ensureEntry(currentDate, ch.key);
    const card = document.createElement('div');
    card.className = 'card ' + ch.key;
    card.innerHTML = `<h3>${ch.label}</h3>` + STAGES.map(stage => `
      <div class="stage-row">
        <span class="stage-lbl">${STAGE_LABELS[stage]}</span>
        <span class="stepper">
          <button data-ch="${ch.key}" data-stage="${stage}" data-delta="-1">–</button>
          <span class="val mono" id="val-${ch.key}-${stage}">${entry[stage]}</span>
          <button data-ch="${ch.key}" data-stage="${stage}" data-delta="1">+</button>
        </span>
      </div>
    `).join('');
    container.appendChild(card);
  });
  container.querySelectorAll('button[data-ch]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ch = btn.dataset.ch, stage = btn.dataset.stage, delta = parseInt(btn.dataset.delta, 10);
      const entry = ensureEntry(currentDate, ch);
      entry[stage] = Math.max(0, entry[stage] + delta);
      document.getElementById(`val-${ch}-${stage}`).textContent = entry[stage];
      await saveData();
      renderFunnel();
      renderLedger();
      renderStreak();
      renderMonthly();
      renderMostUsed();
    });
  });
}

function allTimeTotals(){
  const totals = emptyStage();
  Object.values(data.entries).forEach(dayObj => {
    Object.values(dayObj).forEach(chEntry => {
      STAGES.forEach(s => totals[s] += (chEntry[s] || 0));
    });
  });
  return totals;
}

function renderFunnel(){
  const totals = allTimeTotals();
  const block = document.getElementById('funnelBlock');
  const max = Math.max(totals.sent, 1);
  const colors = { sent: '#8B8F94', replied: 'var(--email)', booked: 'var(--gold)', closed: 'var(--whatsapp)' };
  block.innerHTML = STAGES.map((stage, i) => {
    const count = totals[stage];
    const width = Math.max((count / max) * 100, count > 0 ? 3 : 0);
    let pctLabel = '';
    if(i > 0){
      const prev = totals[STAGES[i-1]];
      const pct = prev > 0 ? Math.round((count / prev) * 100) : 0;
      pctLabel = `<span class="pct">${pct}% of ${STAGE_LABELS[STAGES[i-1]].toLowerCase()}</span>`;
    }
    return `
      <div class="funnel-stage">
        <div class="funnel-label">${STAGE_LABELS[stage]}</div>
        <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${width}%; background:${colors[stage]};"></div></div>
        <div class="funnel-count mono"><span class="n">${count}</span>${pctLabel}</div>
      </div>
    `;
  }).join('');
}

function renderLedger(){
  const body = document.getElementById('ledgerBody');
  const rows = [];
  Object.keys(data.entries).sort().reverse().forEach(date => {
    CHANNELS.forEach(ch => {
      const e = data.entries[date][ch.key];
      if(e && (e.sent||e.replied||e.booked||e.closed)){
        rows.push({ date, ch, e });
      }
    });
  });
  if(rows.length === 0){
    body.innerHTML = `<tr class="empty-row"><td colspan="6">No outreach logged yet — use the counters above to start today's log.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr>
      <td>${r.date}</td>
      <td><span class="ch-dot" style="background:${r.ch.color}"></span>${r.ch.label}</td>
      <td>${r.e.sent}</td>
      <td>${r.e.replied}</td>
      <td>${r.e.booked}</td>
      <td>${r.e.closed}</td>
    </tr>
  `).join('');
}

function renderStreak(){
  document.getElementById('streakNum').textContent = computeStreak();
}

function monthlyTotalsFor(month){
  const totals = {};
  CHANNELS.forEach(ch => totals[ch.key] = 0);
  Object.keys(data.entries).forEach(date => {
    if(date.slice(0,7) !== month) return;
    CHANNELS.forEach(ch => {
      const e = data.entries[date][ch.key];
      if(e) totals[ch.key] += (e.sent || 0);
    });
  });
  return totals;
}

function renderMonthly(){
  const totals = monthlyTotalsFor(currentMonth);
  const grandTotal = Object.values(totals).reduce((a,b) => a+b, 0);
  const max = Math.max(...Object.values(totals), 1);
  const block = document.getElementById('monthlyBlock');
  const monthLabel = new Date(currentMonth + '-01T00:00:00').toLocaleDateString(undefined, { month:'long', year:'numeric' });
  block.innerHTML = `<div class="monthly-total">Total reach in <span class="n">${monthLabel}</span>: <span class="n">${grandTotal}</span> people contacted</div>` +
    CHANNELS.map(ch => {
      const count = totals[ch.key];
      const width = Math.max((count / max) * 100, count > 0 ? 3 : 0);
      return `
        <div class="monthly-row">
          <div class="monthly-label"><span class="ch-dot" style="background:${ch.color}"></span>${ch.label}</div>
          <div class="monthly-bar-wrap"><div class="monthly-bar" style="width:${width}%; background:${ch.color};"></div></div>
          <div class="monthly-count">${count}</div>
        </div>
      `;
    }).join('');
}

function renderMostUsed(){
  const totals = {};
  CHANNELS.forEach(ch => totals[ch.key] = 0);
  Object.values(data.entries).forEach(dayObj => {
    CHANNELS.forEach(ch => {
      const e = dayObj[ch.key];
      if(e) totals[ch.key] += (e.sent || 0);
    });
  });
  let topKey = null, topVal = -1;
  CHANNELS.forEach(ch => { if(totals[ch.key] > topVal){ topVal = totals[ch.key]; topKey = ch.key; } });
  const top = CHANNELS.find(c => c.key === topKey);
  const nameEl = document.getElementById('mostUsedName');
  const dotEl = document.getElementById('mostUsedDot');
  if(!top || topVal <= 0){
    nameEl.textContent = 'No data yet';
    dotEl.style.background = 'var(--border)';
  } else {
    nameEl.textContent = `${top.label} (${topVal})`;
    dotEl.style.background = top.color;
  }
}

function buildTSV(){
  const rows = [['Date','Channel','Sent','Replied','Booked','Closed']];
  Object.keys(data.entries).sort().forEach(date => {
    CHANNELS.forEach(ch => {
      const e = data.entries[date][ch.key];
      if(e && (e.sent||e.replied||e.booked||e.closed)){
        rows.push([date, ch.label, e.sent, e.replied, e.booked, e.closed]);
      }
    });
  });
  return rows.map(r => r.join('\t')).join('\n');
}

async function init(){
  await loadData();
  document.getElementById('todayLabel').textContent = fmtDateLabel(currentDate);
  document.getElementById('datePicker').value = currentDate;
  document.getElementById('datePicker').addEventListener('change', (e) => {
    currentDate = e.target.value || currentDate;
    document.getElementById('todayLabel').textContent = fmtDateLabel(currentDate);
    renderChannelCards();
  });
  document.getElementById('monthPicker').value = currentMonth;
  document.getElementById('monthPicker').addEventListener('change', (e) => {
    currentMonth = e.target.value || currentMonth;
    renderMonthly();
  });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const tsv = buildTSV();
    try{
      await navigator.clipboard.writeText(tsv);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy for Sheets'; btn.classList.remove('copied'); }, 1800);
    }catch(e){
      alert('Could not copy automatically — select and copy the ledger manually.');
    }
  });
  renderChannelCards();
  renderFunnel();
  renderLedger();
  renderStreak();
  renderMonthly();
  renderMostUsed();
}

init();
</script>
</body>
</html>
